name: CI

# This module builds standalone. It did not until 2026-09-05: it depended on
# medsage/proto through `replace ../…`, so it could only be built from
# inside the monorepo and had no CI at all. Those are published modules now,
# which is what makes this workflow possible.
#
# They are private, so the module proxy and checksum database cannot serve them
# and git needs a credential. Each module repo carries a read-only deploy key;
# the private halves are the secrets used below. A deploy key's public half must
# be unique across GitHub, so the two modules need separate keys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Ronin11/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Authenticate to private modules
        env:
          PROTO_KEY: ${{ secrets.PROTO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          test -n "$PROTO_KEY" || { echo "proto_key secret is not set"; exit 1; }
          printf '%s\n' "$PROTO_KEY" > ~/.ssh/proto_key
          chmod 600 ~/.ssh/proto_key
          # Host aliases rather than a single github.com entry: ssh must offer the
          # right deploy key for the right repository, and GitHub rejects a key
          # that does not belong to the repo being fetched.
          cat >> ~/.ssh/config <<'SSHCFG'
          Host proto.github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/proto_key
            IdentitiesOnly yes
          SSHCFG
          git config --global url."git@proto.github.com:Ronin11/medsage-proto".insteadOf "https://github.com/Ronin11/medsage-proto"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
